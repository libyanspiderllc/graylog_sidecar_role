
# Install graylog-sidecar on Windows
- name: Download graylog-sidecar installer
  ansible.builtin.win_get_url:
    url: https://github.com/Graylog2/collector-sidecar/releases/download/1.5.6/graylog_sidecar_installer_1.5.6-1.exe
    dest: C:\Windows\Temp\graylog_sidecar_installer.exe
    validate_certs: false
    force: false

- name: Install graylog-sidecar
  ansible.builtin.win_command: C:\Windows\Temp\graylog_sidecar_installer.exe /S
  register: graylog_sidecar_installed

- name: Configure graylog-sidecar - server_url
  ansible.builtin.win_lineinfile:
    path: C:\Program Files\Graylog\sidecar\sidecar.yml
    line: 'server_url: {{ graylog_url }}'
  notify: restart graylog-sidecar

- name: Configure graylog-sidecar - server_api_token
  ansible.builtin.win_lineinfile:
    path: C:\Program Files\Graylog\sidecar\sidecar.yml
    line: 'server_api_token: "{{ graylog_api_token }}"'
  notify: restart graylog-sidecar

- name: Remove default collector tags
  ansible.builtin.win_lineinfile:
    path: C:\Program Files\Graylog\sidecar\sidecar.yml
    line: 'tags: [ default ]'
    state: absent
  notify: restart graylog-sidecar

- name: Install graylog-sidecar service
  ansible.builtin.win_command:
    cmd: '"C:\Program Files\Graylog\sidecar\graylog-sidecar.exe" -service install'
  when: graylog_sidecar_installed.changed
  ignore_errors: true

- name: Start graylog-sidecar service
  ansible.builtin.win_command:
    cmd: '"C:\Program Files\Graylog\sidecar\graylog-sidecar.exe" -service start'
  when: graylog_sidecar_installed.changed
  ignore_errors: true

